<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0E1B4D" />
    <meta name="format-detection" content="telephone=no" />
    <script>
      document.documentElement.classList.add("js");
      // Safety net: if the app fails to start, never leave reveal-animated content hidden.
      setTimeout(function () {
        if (!document.documentElement.classList.contains("js-ready"))
          document.documentElement.classList.remove("js");
      }, 5000);
    </script>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link
      rel="preload"
      href="/fonts/inter-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/manrope-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <script>
      // Third-party tags (Google Tag Manager, Meta Pixel) wait until the visitor first scrolls, taps
      // or types, or until 4 s after the page has loaded, whichever comes first. Their queues
      // (dataLayer, fbq) start right away, so nothing is lost; the tags just stay off the first screen.
      (function (w) {
        var q = [], done = 0, ev = ["scroll", "pointerdown", "keydown", "touchstart"];
        function run() {
          if (done) return;
          done = 1;
          ev.forEach(function (e) { w.removeEventListener(e, run, { passive: true }); });
          for (var i = 0; i < q.length; i++) q[i]();
          q = [];
        }
        w.t2oLate = function (f) { done ? f() : q.push(f); };
        ev.forEach(function (e) { w.addEventListener(e, run, { passive: true }); });
        w.addEventListener("load", function () { setTimeout(run, 4000); });
      })(window);
      (function (w, d, s, l, i) {
        w[l] = w[l] || [];
        w[l].push({ "gtm.start": new Date().getTime(), event: "gtm.js" });
        w.t2oLate(function () {
          var f = d.getElementsByTagName(s)[0],
            j = d.createElement(s),
            dl = l != "dataLayer" ? "&l=" + l : "";
          j.async = true;
          j.src = "https://www.googletagmanager.com/gtm.js?id=" + i + dl;
          f.parentNode.insertBefore(j, f);
        });
      })(window, document, "script", "dataLayer", "GTM-MF5D955");
    </script>
    <!--app-head-->
  </head>
  <body>
    <noscript>
      <iframe
        src="https://www.googletagmanager.com/ns.html?id=GTM-MF5D955"
        height="0"
        width="0"
        style="display: none; visibility: hidden"
      >
      </iframe>
    </noscript>
    <noscript
      ><style>
        .reveal {
          opacity: 1 !important;
          transform: none !important;
        }
      </style></noscript
    >
    <div id="root"><!--app-html--></div>
    <script>
      // Legacy hash URLs (/#/about) from the previous site -> clean URLs (/about/).
      (function () {
        var h = location.hash;
        if (
          h &&
          h.indexOf("#/") === 0 &&
          document.documentElement.getAttribute("data-router") !== "hash"
        ) {
          var p = h.slice(1).split("?")[0];
          if (p.charAt(p.length - 1) !== "/") p += "/";
          location.replace(p);
        }
      })();
    </script>
    <script type="module" src="/src/entry-client.jsx"></script>
  </body>
</html>
