<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0E1B4D" />
    <meta name="format-detection" content="telephone=no" />
    <script>
      document.documentElement.classList.add("js");
      // Safety net: if the app fails to start, never leave reveal-animated content hidden.
      setTimeout(function () {
        if (!document.documentElement.classList.contains("js-ready"))
          document.documentElement.classList.remove("js");
      }, 5000);
    </script>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link
      rel="preload"

      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/manrope-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <script>
      // Third-party tags (Google Tag Manager, Meta Pixel) wait until the visitor first scrolls, taps
      // or types, or until 4 s after the page has loaded, whichever comes first. Their queues
      // (dataLayer, fbq) start right away, so nothing is lost; the tags just stay off the first screen.

          q = [];

        w.t2oLate = function (f) { done ? f() : q.push(f); };
        ev.forEach(function (e) { w.addEventListener(e, run, { passive: true }); });
        w.addEventListener("load", function () { setTimeout(run, 4000); });
      })(window);
      // Cookie consent first: Consent Mode starts "denied", and Google Tag Manager (which sets
      // analytics and marketing cookies) loads only after the visitor allowed analytics or
      // marketing. Before that choice, no tag manager runs. The app loads GTM later if they accept.
      (function (w) {
        w.dataLayer = w.dataLayer || [];
        function g() { w.dataLayer.push(arguments); }
        g("consent", "default", { analytics_storage: "denied", ad_storage: "denied", ad_user_data: "denied", ad_personalization: "denied", functionality_storage: "denied", personalization_storage: "denied", security_storage: "granted", wait_for_update: 500 });
        var c = null;
        try { c = JSON.parse(w.localStorage.getItem("t2o_consent_v1")); } catch (e) {}
        if (!c) {
          var m = document.cookie.match(/(?:^|; )t2o_consent=([^;]*)/);
          if (m) { try { c = JSON.parse(decodeURIComponent(m[1])); } catch (e) {} }
        }
        w.t2oConsentAllowsTags = !!(c && (c.analytics || c.marketing));
      })(window);
      (function (w, d, s, l, i) {
        if (!w.t2oConsentAllowsTags) return;
        w.__t2oGtmLoaded = 1;
        w[l] = w[l] || [];
        w[l].push({ "gtm.start": new Date().getTime(), event: "gtm.js" });
        w.t2oLate(function () {
          var f = d.getElementsByTagName(s)[0],
            j = d.createElement(s),

  <body>
    <noscript
      ><style>
        .reveal {
          opacity: 1 !important;
          transform: none !important;
        }
      </style></noscript
    >
    <div id="root"><!--app-html--></div>
    <script>
      // Legacy hash URLs (/#/about) from the previous site -> clean URLs (/about/).
      (function () {
        var h = location.hash;
        if (
          h &&
          h.indexOf("#/") === 0 &&
          document.documentElement.getAttribute("data-router") !== "hash"
        ) {
          var p = h.slice(1).split("?")[0];
          if (p.charAt(p.length - 1) !== "/") p += "/";
          location.replace(p);
        }
      })();
    </script>
    <script type="module" src="/src/entry-client.jsx"></script>
  </body>
