# nginx / OpenResty config for the prerendered Turn2Opinion build (dist/client).
#
# Fixes three items from the SEO audit:
#   * "Avoid multiple page redirects": every non-canonical address (http://, bare domain) goes to
#     https://www.turn2opinion.com in ONE 301, instead of http -> https -> www (two hops).
#   * "Browser caching": hashed build files are cached for a year, other static files for 30 days.
#   * "Compression": gzip on for text assets (enable brotli too if the module is installed).
#
# Put the certificate paths and the backend upstream in place for your server, then:
#   nginx -t && nginx -s reload

# 1) Plain HTTP, any host -> one hop to the canonical HTTPS www origin.
server {
    listen 80;
    listen [::]:80;
    server_name turn2opinion.com www.turn2opinion.com;
    return 301 https://www.turn2opinion.com$request_uri;
}

# 2) HTTPS on the bare domain -> one hop to www.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name turn2opinion.com;
    ssl_certificate     /etc/ssl/turn2opinion/fullchain.pem;
    ssl_certificate_key /etc/ssl/turn2opinion/privkey.pem;
    return 301 https://www.turn2opinion.com$request_uri;
}

# 3) The canonical site.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.turn2opinion.com;
    ssl_certificate     /etc/ssl/turn2opinion/fullchain.pem;
    ssl_certificate_key /etc/ssl/turn2opinion/privkey.pem;

    root /usr/share/nginx/html;   # contents of dist/client
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml
               application/manifest+json image/svg+xml font/woff;
    # brotli on; brotli_comp_level 6; brotli_types <same list>;   # if ngx_brotli is available

    # Backend API: proxied, never cached here. Point it at your existing backend upstream.
    # location /api/ { proxy_pass http://backend:8000; }

    # Hashed build output (assets/index-AbC123.js, assets/css-core-XyZ.css): safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Fonts, flags, images, icons, QR codes: change only with a release.
    location ~* ^/(fonts|flags|images|img|icons|illustrations|qr)/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location ~* \.(?:png|jpe?g|webp|avif|svg|gif|ico|woff2?|mp3|wav)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }
    location ~* ^/(data|i18n)/ {
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # The service worker and its registration must always be revalidated.
    location = /sw.js         { add_header Cache-Control "no-cache" always; }
    location = /registerSW.js { add_header Cache-Control "no-cache" always; }

    # Pages: each route is a prerendered folder with its own index.html.
    # /about -> /about/ in one redirect; unknown URLs get the branded 404 with a real 404 status.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;
    location = /404.html { internal; add_header Cache-Control "no-cache" always; }
}
