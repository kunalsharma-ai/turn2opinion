# nginx config INSIDE the frontend-1 Docker image (copied to /etc/nginx/conf.d/default.conf).
#
# The image serves the prerendered build. Copy the CONTENTS of dist/client into the web root:
#   COPY --from=builder /frfs/dist/client/ /usr/share/nginx/html/
# (`npm run build` writes the site to dist/client; dist/server is only used while prerendering.)
#
# HTTPS and the http -> https://www. redirect are handled by the OpenResty gateway in front of
# this container (see deploy/nginx.conf for the single-hop redirect rules). This container only
# listens on plain HTTP, so it must not redirect to https itself or the two would loop.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Redirects keep the scheme/host the visitor used (the gateway's https://www.), not :80.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json
               application/xml application/manifest+json application/wasm image/svg+xml font/woff;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hashed build output (assets/index-AbC123.js, assets/css-core-XyZ.css): cache for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Fonts, flags, images, icons, QR codes: change only with a release.
    location ~* ^/(fonts|flags|images|img|icons|illustrations|qr)/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location ~* \.(?:png|jpe?g|webp|avif|svg|gif|ico|woff2?|mp3|wav)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }
    location ~* ^/(data|i18n)/ {
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # Service worker files must always be revalidated.
    location = /sw.js         { add_header Cache-Control "no-cache" always; expires off; }
    location = /registerSW.js { add_header Cache-Control "no-cache" always; expires off; }

    # Pages: every route is a prerendered folder with its own index.html.
    # /about -> /about/ (one redirect). Unknown URLs get the branded 404 page with a real 404
    # status instead of falling back to /index.html: that fallback answered every bad URL with the
    # home page and a 200, which search engines treat as duplicate "soft 404" pages.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ $uri.html =404;
    }
    error_page 404 /404.html;
    location = /404.html { internal; add_header Cache-Control "no-cache" always; }
}
