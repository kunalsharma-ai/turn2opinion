<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Embed example — your logged-in app</title>
  <style>body{margin:0;font-family:Georgia,serif;background:#eee} .host-nav{padding:14px 20px;background:#222;color:#fff}</style>
</head>
<body>
  <!-- Your app's own header stays untouched — the consent page renders in a Shadow DOM below it -->
  <div class="host-nav">Your app header (example)</div>

  <div id="t2o-consent"></div>
  <script>
    window.T2O_CONSENT = {
      member: { id: '12345', firstName: 'Priya' },
      submitUrl: '/api/consent',            // your endpoint (see README → API)
      headers: { 'X-CSRF-Token': 'TOKEN' },  // optional
      continueUrl: '/dashboard',
      logoutUrl: '/logout',
      assetBase: '/',                        // URL where dist/ (brand/, fonts/) is published
    };
    window.addEventListener('t2o:consent', function (e) { console.log('consent saved', e.detail); });
  </script>
  <script src="/embed/t2o-consent.js" defer></script>
</body>
</html>
