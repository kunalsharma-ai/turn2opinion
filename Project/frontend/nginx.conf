server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        set $req_path $uri;

        if ($uri ~ ^(.+)/$) {
            set $req_path $1;
        }

        try_files $req_path.html $uri $uri/ $uri.html /index.html;
    }

    # Cache static assets aggressively
    location /_next/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
